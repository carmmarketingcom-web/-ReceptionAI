<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="markGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="markGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Interlocking geometric mark -->
  <g transform="translate(90, 90)">
    <!-- Left block (abstract R) -->
    <path d="M-38,-44 L-8,-44 L-8,-14 L-2,-14 C12,-14 20,-6 20,4 C20,14 12,22 -2,22 L-38,22 Z M-8,-8 L-8,16 L-2,16 C8,16 14,10 14,4 C14,-2 8,-8 -2,-8 Z" 
          fill="url(#markGrad1)"/>
    
    <!-- Right block (abstract A) -->
    <path d="M8,-44 L38,-44 L38,22 L8,22 Z" fill="url(#markGrad2)" opacity="0.9"/>
    <path d="M8,-22 L24,-44 L38,-22 L24,0 Z" fill="url(#markGrad1)"/>
    
    <!-- Center connection bar -->
    <rect x="-4" y="-12" width="12" height="8" rx="2" fill="url(#markGrad2)" opacity="0.8"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(160, 70)">
    <text x="0" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="46" letter-spacing="0" fill="#1e293b">reception</text>
    <text x="222" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="46" letter-spacing="0" fill="#3b82f6">ai</text>
    
    <!-- Underline accent bar -->
    <rect x="0" y="36" width="80" height="3" rx="1.5" fill="#6366f1"/>
    
    <!-- Tagline -->
    <text x="0" y="58" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" 
          font-size="13" letter-spacing="3" fill="#94a3b8">ALWAYS ANSWERS. NEVER SLEEPS.</text>
  </g>
</svg>