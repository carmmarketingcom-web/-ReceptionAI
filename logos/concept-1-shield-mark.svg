<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#2d3a4a"/>
    </linearGradient>
  </defs>
  
  <!-- Shield mark -->
  <g transform="translate(90, 90)">
    <!-- Shield body -->
    <path d="M-35,-45 L35,-45 L35,10 C35,35 20,52 0,60 C-20,52 -35,35 -35,10 Z" 
          fill="url(#shieldGrad)" stroke="#f0a030" stroke-width="2.5"/>
    
    <!-- Phone receiver inside shield -->
    <g stroke="#f0a030" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Handset arc -->
      <path d="M-12,-22 C-12,-30 -8,-34 0,-34 C8,-34 12,-30 12,-22 L12,-8 C12,-2 9,2 3,2 L-3,2 C-9,2 -12,-2 -12,-8 Z"/>
      <!-- Earpiece/speaker lines -->
      <line x1="-8" y1="-24" x2="-8" y2="-16"/>
      <line x1="8" y1="-24" x2="8" y2="-16"/>
      <!-- Mouthpiece -->
      <line x1="-6" y1="-4" x2="6" y2="-4" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(155, 75)">
    <text x="0" y="32" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="48" letter-spacing="1" fill="#1a2332">Reception</text>
    <text x="258" y="32" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="48" letter-spacing="1" fill="#f0a030">AI</text>
    <text x="0" y="56" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" 
          font-size="14" letter-spacing="4" fill="#6b7280" text-anchor="start">YOUR 24/7 AI RECEPTIONIST</text>
  </g>
</svg>