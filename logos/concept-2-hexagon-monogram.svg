<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagonal mark -->
  <g transform="translate(85, 90)">
    <!-- Outer hexagon -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" 
             fill="url(#hexGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>
    
    <!-- Inner R letterform -->
    <text x="-2" y="14" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="52" fill="url(#accentGrad)" text-anchor="middle">R</text>
    
    <!-- Subtle connection dot -->
    <circle cx="0" cy="-48" r="4" fill="#06b6d4"/>
    <circle cx="42" cy="-24" r="3" fill="#06b6d4" opacity="0.5"/>
    <circle cx="-42" cy="-24" r="3" fill="#06b6d4" opacity="0.5"/>
    <circle cx="0" cy="48" r="4" fill="#06b6d4"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(155, 68)">
    <!-- RECEPTIONAI all caps -->
    <text x="0" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="44" letter-spacing="3" fill="#0f172a">RECEPTION</text>
    <text x="274" y="28" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" 
          font-size="44" letter-spacing="3" fill="#06b6d4">AI</text>
    
    <!-- Tagline -->
    <text x="0" y="54" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="600" 
          font-size="13" letter-spacing="5" fill="#64748b">INTELLIGENT CALL HANDLING</text>
  </g>
</svg>