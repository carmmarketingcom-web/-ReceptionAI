<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- Concept C: Reception Bell + Digital Ring -->
  <g transform="translate(12, 8)">
    <!-- Bell body — bold, solid -->
    <path d="M16,20 Q16,8 32,4 Q48,8 48,20 L48,36 Q48,40 32,40 Q16,40 16,36 Z" 
          fill="none" stroke="#111827" stroke-width="7" stroke-linejoin="round"/>
    <!-- Bell clapper -->
    <circle cx="32" cy="46" r="4" fill="#111827"/>
    <!-- Digital accent ring around bell -->
    <path d="M48,16 Q56,8 56,20 Q56,36 56,44" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="46" r="2" fill="#3B82F6"/>
  </g>

  <!-- Wordmark -->
  <text x="86" y="46" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#111827">Reception</text>
  <text x="250" y="46" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#3B82F6">AI</text>
</svg>
