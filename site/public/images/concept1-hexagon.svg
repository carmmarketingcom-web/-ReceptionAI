<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Concept 1: Hexagon Signal Mark -->
  <!-- Hexagon frame -->
  <g transform="translate(8, 6)">
    <polygon points="34,0 68,19 68,49 34,68 0,49 0,19" fill="#1E2A4F" stroke="#1E2A4F" stroke-width="0"/>
    <!-- Inner geometric signal arcs -->
    <path d="M20,28 Q34,14 48,28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M16,36 Q34,18 52,36" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M12,44 Q34,22 56,44" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Accent node -->
    <circle cx="46" cy="28" r="4" fill="url(#accent)"/>
  </g>

  <!-- Wordmark -->
  <text x="86" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#111827">Reception</text>
  <text x="250" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#2563EB">AI</text>

  <!-- Tagline -->
  <text x="88" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.5" fill="#64748B">YOUR 24/7 AI RECEPTIONIST</text>
</svg>
