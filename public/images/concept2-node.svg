<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Concept 2: The Node Mark — two interlocking geometric diamonds -->
  <g transform="translate(12, 8)">
    <!-- Left diamond (communication) -->
    <rect x="10" y="11" width="24" height="24" rx="3" fill="#1E2A4F" transform="rotate(45 22 23)"/>
    <!-- Right diamond (AI/tech) -->
    <rect x="22" y="11" width="24" height="24" rx="3" fill="url(#accent2)" transform="rotate(45 34 23)"/>
    <!-- Connection line -->
    <line x1="16" y1="23" x2="28" y2="23" stroke="white" stroke-width="2"/>
    <!-- Center dot -->
    <circle cx="22" cy="23" r="2.5" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#111827">Reception</text>
  <text x="244" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="url(#accent2)">AI</text>

  <!-- Tagline -->
  <text x="82" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.5" fill="#64748B">YOUR 24/7 AI RECEPTIONIST</text>
</svg>
