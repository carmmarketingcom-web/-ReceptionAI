<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-8 font-sans antialiased">
<div class="max-w-5xl mx-auto space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-bold text-gray-900">Schedule</h1><p class="mt-1 text-sm text-gray-400">0 upcoming appointments</p></div>
    <div class="flex items-center gap-2">
      <button class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-medium text-gray-500">Today</button>
      <div class="flex items-center gap-1 text-sm">
        <button class="rounded-lg p-1.5 text-gray-400">◀</button>
        <span class="min-w-[120px] text-center font-medium text-gray-700">July 2026</span>
        <button class="rounded-lg p-1.5 text-gray-400">▶</button>
      </div>
    </div>
  </div>
  <div class="grid gap-6 lg:grid-cols-[320px_1fr]">
    <div class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm">
      <div class="mb-2 grid grid-cols-7">
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Sun</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Mon</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Tue</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Wed</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Thu</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Fri</div>
        <div class="py-1 text-center text-[11px] font-medium uppercase tracking-wider text-gray-400">Sat</div>
      </div>
      <div class="grid grid-cols-7">
        <div class="aspect-square"></div><div class="aspect-square"></div><div class="aspect-square"></div>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">1</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">2</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">3</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">4</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">5</span><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2"><div class="h-0.5 w-4 rounded-full bg-indigo-400"></div></div></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">6</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">7</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">8</span><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2"><div class="h-0.5 w-4 rounded-full bg-blue-400"></div></div></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">9</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">10</span><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2"><div class="h-0.5 w-4 rounded-full bg-green-400"></div></div></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">11</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">12</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">13</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">14</span><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2"><div class="h-0.5 w-4 rounded-full bg-indigo-400"></div></div><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2" style="margin-left:6px"><div class="h-0.5 w-4 rounded-full bg-blue-400"></div></div></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">15</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">16</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">17</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">18</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">19</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">20</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">21</span></button>
        <button class="relative aspect-square bg-indigo-50 ring-1 ring-inset ring-indigo-200"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-medium text-indigo-600">22</span><div class="absolute bottom-0.5 left-1/2 -translate-x-1/2"><div class="h-1 w-3 rounded-full bg-indigo-400"></div></div></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">23</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm bg-indigo-100 font-semibold text-indigo-700">24</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">25</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">26</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">27</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">28</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">29</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">30</span></button>
        <button class="relative aspect-square"><span class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm font-normal text-gray-600 hover:bg-gray-50">31</span></button>
      </div>
    </div>
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between"><h3 class="text-sm font-semibold text-gray-900">July 22, 2026</h3><span class="text-xs text-gray-400">2 appointments</span></div>
      <div class="space-y-2">
        <div class="rounded-xl border border-gray-100 bg-white p-4 border-l-4 border-l-indigo-400">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2"><p class="text-sm font-semibold text-gray-900">10:00 AM</p><span class="text-gray-300">–</span><p class="text-sm text-gray-400">11:00 AM</p></div>
              <p class="mt-0.5 text-sm font-medium text-gray-800">John Smith</p>
              <p class="text-xs text-gray-500">HVAC Inspection <span class="ml-2 text-gray-400">(555) 123-4567</span></p>
            </div>
            <span class="flex-shrink-0 rounded-full bg-indigo-50 px-2.5 py-0.5 text-[11px] font-medium text-indigo-700">confirmed</span>
          </div>
        </div>
        <div class="rounded-xl border border-gray-100 bg-white p-4 border-l-4 border-l-blue-400">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2"><p class="text-sm font-semibold text-gray-900">2:30 PM</p></div>
              <p class="mt-0.5 text-sm font-medium text-gray-800">Maria Lopez</p>
              <p class="text-xs text-gray-500">Plumbing Repair <span class="ml-2 text-gray-400">(555) 987-6543</span></p>
            </div>
            <span class="flex-shrink-0 rounded-full bg-blue-50 px-2.5 py-0.5 text-[11px] font-medium text-blue-700">scheduled</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
